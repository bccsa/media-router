# GitHub honours closing keywords ("Fixes #123") only on PRs merged into the
# default branch (main). v2.0 is where the work lands, so do the same here:
# on merge into v2.0, close every issue the PR description names with
# close/closes/closed, fix/fixes/fixed or resolve/resolves/resolved.
#
# `pull_request`, not `pull_request_target`: the latter always runs the
# workflow file from the default branch, so it would never see this one.
name: Close linked issues on merge

on:
  pull_request:
    types: [closed]
    branches: [v2.0]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const numbers = new Set([...(pr.body ?? '').matchAll(keyword)].map((m) => Number(m[1])));
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Fixed by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed #${issue_number}`);
            }
